
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: springservice-project-base
  namespace: argocd
spec:
  description: Skeleton for springservice project
  sourceRepos:
    - https://github.com/SodiqIshola/springservice.git
  destinations:
    # Common namespaces allowed in all environments
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
