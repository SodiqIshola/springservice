apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: springservice-projects
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: dev
            namespace: development
          - env: prod
            namespace: production
  template:
    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: springservice-project-{{env}}
      namespace: argocd
    spec:
      description: Project for springservice {{env}} environment
      sourceRepos:
        - https://github.com/SodiqIshola/springservice.git
      destinations:
        - namespace: "{{namespace}}"
          server: https://kubernetes.default.svc
        - namespace: argocd
          server: https://kubernetes.default.svc
      clusterResourceWhitelist:
        - group: ""
          kind: Namespace
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
        - group: rbac.authorization.k8s.io
          kind: ClusterRole
        - group: rbac.authorization.k8s.io
          kind: ClusterRoleBinding
      namespaceResourceWhitelist:
        - group: "*"
          kind: "*"
