apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: springservice-apps
  namespace: argocd
spec:
  # Required to activate templatePatch and Go template evaluation
  goTemplate: true
  generators:
    - matrix:
        # The matrix generator combines the elements mathematically (2 environments × 1 component = 2 applications):
        generators:
          # Generator 1: Defines environment-specific values
          - list:
              elements:
                - env: dev
                  namespace: development
                - env: prod
                  namespace: production
          # Generator 2: Defines static component structures
          - list:
              elements:
                - name: app
  template:
    metadata:
      name: springservice-{{.env}}-{{.name}}
    spec:
      project: springservice-project-{{.env}}
      source:
        repoURL: https://github.com/SodiqIshola/springservice.git
        targetRevision: HEAD
        path: k8s/overlays/{{.env}}
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m

  # Patches are appended to the template block
  templatePatch: |
    {{- if eq .env "dev" }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
    {{- end }}
