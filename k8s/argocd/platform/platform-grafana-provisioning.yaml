apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-grafana-provisioning
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform-project
  source:
    repoURL: https://github.com/SodiqIshola/springservice.git
    targetRevision: HEAD
    path: k8s/platform/helmfile/observability/prometheus-stack/grafana
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
