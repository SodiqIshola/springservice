apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-helmfile
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform-project
  source:
    repoURL: https://github.com/SodiqIshola/springservice.git
    targetRevision: HEAD
    path: k8s/platform/helmfile
    plugin:
      name: helmfile
      env:
        - name: HELMFILE_ENVIRONMENT
          value: prod  # Use prod as default for centralized platform
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
