# ============================================================================
# Service: pgAdmin Credentials
# Description: Provides the default development login used by pgAdmin.
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: pgadmin-secret
  namespace: development
  labels:
    app.kubernetes.io/name: pgadmin
    app.kubernetes.io/part-of: springservice
type: Opaque
stringData:
  PGADMIN_DEFAULT_EMAIL: "pgadmin4@pgadmin.org"
  PGADMIN_DEFAULT_PASSWORD: "admin"
