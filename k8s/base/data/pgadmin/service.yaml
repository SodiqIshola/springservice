# ============================================================================
# Service: pgAdmin ClusterIP Service
# Description: Exposes the pgAdmin web UI inside the development namespace.
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  namespace: development
  labels:
    app.kubernetes.io/name: pgadmin
    app.kubernetes.io/part-of: springservice
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pgadmin
  ports:
    - name: http
      port: 80
      targetPort: http
