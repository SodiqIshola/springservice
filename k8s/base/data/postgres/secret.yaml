# ============================================================================
# Service: PostgreSQL Credentials
# Description: Provides the development database credentials used by the
#              Spring services and PostgreSQL container.
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: development
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: springservice
type: Opaque
stringData:
  POSTGRES_USER: "dotmonsscode"
  POSTGRES_PASSWORD: "password"
