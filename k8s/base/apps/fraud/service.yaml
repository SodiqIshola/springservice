# ============================================================================
# Service: Fraud ClusterIP Service
# Description: Exposes the fraud API inside the development namespace.
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: fraud
  namespace: development
  labels:
    app.kubernetes.io/name: fraud
    app.kubernetes.io/part-of: springservice
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fraud
  ports:
    - name: http
      port: 8081
      targetPort: http
