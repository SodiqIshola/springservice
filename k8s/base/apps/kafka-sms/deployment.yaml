# ============================================================================
# Service: Kafka SMS Deployment
# Description: Runs the SMS worker that consumes Kafka events and handles SMS
#              processing.
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-sms
  namespace: development
  labels:
    app.kubernetes.io/name: kafka-sms
    app.kubernetes.io/part-of: springservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-sms
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-sms
        app.kubernetes.io/part-of: springservice
    spec:
      containers:
        - name: kafka-sms
          image: sunky24/kafkasms-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8498
          envFrom:
            - configMapRef:
                name: kafka-sms-config
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 18
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 6
