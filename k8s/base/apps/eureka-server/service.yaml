# ============================================================================
# Service: Eureka Server ClusterIP Service
# Description: Exposes Eureka inside the cluster on eureka-server:8761.
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: development
  labels:
    app.kubernetes.io/name: eureka-server
    app.kubernetes.io/part-of: springservice
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: eureka-server
  ports:
    - name: http
      port: 8761
      targetPort: http
