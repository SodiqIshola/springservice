# ============================================================================
# Service: Twilio SMS Secret Example
# Description: Documents the required Twilio credentials without storing real
#              production secret values.
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: twilio-sms-secret
  namespace: development
  labels:
    app.kubernetes.io/name: twilio-sms
    app.kubernetes.io/part-of: springservice
type: Opaque
stringData:
  TWILIO_ACCOUNT_SID: "replace-me"
  TWILIO_AUTH_TOKEN: "replace-me"
  TWILIO_FROM_NUMBER: "replace-me"
