# ============================================================================
# Service: Twilio SMS Deployment
# Description: Runs the SMS gateway that connects application messaging to the
#              Twilio API.
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twilio-sms
  namespace: development
  labels:
    app.kubernetes.io/name: twilio-sms
    app.kubernetes.io/part-of: springservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: twilio-sms
  template:
    metadata:
      labels:
        app.kubernetes.io/name: twilio-sms
        app.kubernetes.io/part-of: springservice
    spec:
      containers:
        - name: twilio-sms
          image: sunky24/twilosms-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8444
          envFrom:
            - configMapRef:
                name: twilio-sms-config
            - secretRef:
                name: twilio-sms-secret
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 18
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 6
