# ============================================================================
# Service: Kafka StatefulSet
# Description: Runs the single-node Kafka broker with persistent log storage
#              and constrained JVM heap settings.
# ============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: development
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: springservice
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: springservice
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.4.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: broker
              containerPort: 9092
          envFrom:
            - configMapRef:
                name: kafka-config
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          resources:
            requests:
              cpu: 300m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            tcpSocket:
              port: broker
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            tcpSocket:
              port: broker
            periodSeconds: 30
            failureThreshold: 8
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
        labels:
          app.kubernetes.io/name: kafka
          app.kubernetes.io/part-of: springservice
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
