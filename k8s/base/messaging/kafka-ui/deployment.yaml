# ============================================================================
# Service: Kafka UI Deployment
# Description: Runs the Kafka web administration UI from the Docker Compose
#              setup with constrained JVM memory.
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: development
  labels:
    app.kubernetes.io/name: kafka-ui
    app.kubernetes.io/part-of: springservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-ui
        app.kubernetes.io/part-of: springservice
    spec:
      containers:
        - name: kafka-ui
          image: ghcr.io/kafbat/kafka-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: kafka-ui-config
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 6
