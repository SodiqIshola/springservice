# ============================================================================
# Service: ZooKeeper StatefulSet
# Description: Runs the coordination service required by the single-node Kafka
#              broker in the development namespace.
# ============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: development
  labels:
    app.kubernetes.io/name: zookeeper
    app.kubernetes.io/part-of: springservice
spec:
  serviceName: zookeeper
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zookeeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zookeeper
        app.kubernetes.io/part-of: springservice
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.4.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: client
              containerPort: 2181
          envFrom:
            - configMapRef:
                name: zookeeper-config
          volumeMounts:
            - name: zookeeper-data
              mountPath: /var/lib/zookeeper/data
            - name: zookeeper-log
              mountPath: /var/lib/zookeeper/log
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: client
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: client
            periodSeconds: 30
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: zookeeper-data
        labels:
          app.kubernetes.io/name: zookeeper
          app.kubernetes.io/part-of: springservice
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 512Mi
    - metadata:
        name: zookeeper-log
        labels:
          app.kubernetes.io/name: zookeeper
          app.kubernetes.io/part-of: springservice
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 512Mi
